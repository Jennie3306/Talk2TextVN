name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:   # cho phép bấm chạy tay từ tab Actions nếu cần

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add space https://LeeUyen06:${HF_TOKEN}@huggingface.co/spaces/LeeUyen06/Talk2TextVN
          git push --force space main
